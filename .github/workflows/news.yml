name: Сбор новостей
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сбор новостей
        run: |
          curl -sL -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://e-disclosure.ru/rss/events" -o raw.xml
          python3 parse_news.py > news.json
          cat news.json

      - name: Сохранить
        run: |
          git config user.name "Actions"
          git config user.email "actions@github.com"
          git add news.json raw.xml 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Новости $(date +%Y-%m-%d_%H:%M)"
          git push
